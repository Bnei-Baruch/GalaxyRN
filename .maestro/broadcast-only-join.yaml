appId: ${APP_ID}
name: broadcast-only-join — Ten OFF, join the broadcast (no ten picked)
tags:
  - feature
---
# Precondition: before-room Settings screen, Ten ON (default). Ends in the room.
# Broadcast-only doesn't join a ten: the ten picker disappears and Join is
# enabled without a room.
- extendedWaitUntil:
    visible:
      id: "joinRoomBtn"
    timeout: 60000
- tapOn:
    id: "entryTenBtn"
- assertVisible:
    text: ".*Broadcast only.*"
- assertNotVisible:
    id: "roomSelectTrigger"
- assertVisible:
    id: "joinRoomBtn"
    enabled: true
- takeScreenshot: verify-results/e2-before-join
- tapOn:
    id: "joinRoomBtn"
- extendedWaitUntil:
    visible:
      id: "leaveBtn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# Top bar shows the broadcast, not a ten name.
- assertVisible:
    text: "Broadcast"
- takeScreenshot: verify-results/e2-room
