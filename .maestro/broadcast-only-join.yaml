appId: ${APP_ID}
name: broadcast-only-join — "Broadcast only" mode, join the broadcast (no ten picked)
tags:
  - feature
---
# Precondition: before-room Settings screen, default mode (Ten and broadcast). Ends in the room.
# Broadcast-only doesn't join a ten: the ten picker disappears and Join is
# enabled without a room.
- extendedWaitUntil:
    visible:
      id: "joinRoomBtn"
    timeout: 60000
- tapOn:
    id: "entryModeBroadcast"
- assertVisible:
    text: ".*won't join the ten.*"
- assertNotVisible:
    id: "roomSelectTrigger"
- assertVisible:
    id: "joinRoomBtn"
    enabled: true
- takeScreenshot: verify-results/e2-before-join
# Switching mode re-lays out the screen (the ten picker goes, Join becomes a wide standalone
# button). A tap fired while that settles can be lost — seen on Android right after the
# entry-options flow: no joinRoom at all, a second tap joined at once. Settle, and retry once.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "joinRoomBtn"
- extendedWaitUntil:
    visible:
      id: "leaveBtn"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "joinRoomBtn"
    commands:
      - tapOn:
          id: "joinRoomBtn"
- extendedWaitUntil:
    visible:
      id: "leaveBtn"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# Top bar shows the broadcast, not a ten name.
- assertVisible:
    text: "Broadcast"
- takeScreenshot: verify-results/e2-room
