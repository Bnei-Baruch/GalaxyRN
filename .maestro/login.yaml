appId: com.galaxy_mobile
name: login — Keycloak OAuth
tags:
  - login
env:
  E2E_USERNAME: ""
  E2E_PASSWORD: ""
---
# Requires E2E_USERNAME / E2E_PASSWORD (loaded from .env by scripts/device-verify.sh).
# Match by testID (language-independent) — see src/auth/LoginScreen.js testID="loginBtn".
- tapOn:
    id: "loginBtn"
# ---------------------------------------------------------------------------
# Keycloak login page opens in a Chrome Custom Tab (accounts.kab.info).
# The selectors below are BEST-GUESS and MUST be tuned by the device-verifier
# subagent against the real page (field labels / button text can differ).
# ---------------------------------------------------------------------------
- extendedWaitUntil:
    visible:
      text: ".*(Username|Email|Sign in|Log in).*"
    timeout: 45000
- tapOn:
    text: ".*(Username|Email).*"
- inputText: ${E2E_USERNAME}
- tapOn:
    text: ".*Password.*"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    text: ".*(Sign In|Log In|Login).*"
# Back in the app after the OAuth redirect (com.galaxy://callback).
- extendedWaitUntil:
    visible: "Join Room"
    timeout: 90000
- takeScreenshot: verify-results/login-settings
