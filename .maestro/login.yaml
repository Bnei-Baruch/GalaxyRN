appId: com.galaxy_mobile
name: login — Keycloak OAuth
tags:
  - login
env:
  E2E_USERNAME: ""
  E2E_PASSWORD: ""
---
# Requires E2E_USERNAME / E2E_PASSWORD (loaded from .env by scripts/device-verify.sh).
# Match by testID (language-independent) — see src/auth/LoginScreen.js testID="loginBtn".
- tapOn:
    id: "loginBtn"
# ---------------------------------------------------------------------------
# Keycloak login page opens in a Chrome Custom Tab (accounts.kab.info).
# Match form fields by their HTML id (Keycloak standard: username / password /
# kc-login) — language-independent, unlike the visible labels.
# ---------------------------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "username"
    timeout: 45000
- tapOn:
    id: "username"
- inputText: ${E2E_USERNAME}
- tapOn:
    id: "password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: "kc-login"
# Back in the app after the OAuth redirect (com.galaxy://callback).
# Settings screen "Join Room" button — matched by testID (src/settings/JoinRoomBtn.js).
- extendedWaitUntil:
    visible:
      id: "joinRoomBtn"
    timeout: 90000
- takeScreenshot: verify-results/login-settings
