appId: ${APP_ID}
name: login — Keycloak OAuth
tags:
  - login
# NOTE: no `env:` block on purpose. E2E_USERNAME/E2E_PASSWORD MUST be passed via `-e`
# (scripts/device-verify.sh builds the -e flags from .env). Maestro 2.7.0 interpolates
# ${VAR} only from `-e` or an `env:` block — NOT from the OS environment — and an unresolved
# ${VAR} is typed literally as "undefined". An empty `env:` default here would also SHADOW the
# -e value (and override values passed down via `runFlow`), so we intentionally omit it.
---
# Requires E2E_USERNAME / E2E_PASSWORD (loaded from .env by scripts/device-verify.sh) and
# -e APP_ID=<bundle> (Android: com.galaxy_mobile, iOS: com.galaxy.mobile).
#
# The Keycloak page is reached differently per platform, so the web-form steps branch on
# `when: platform:`:
#   - Android → Chrome Custom Tab, which exposes the page's HTML ids as resource-ids → match by id.
#   - iOS     → ASWebAuthenticationSession (SFSafariViewController). Its web content is NOT exposed
#               by HTML id to XCTest, only by visible TEXT → match by text (assumes English Keycloak UI).
- launchApp:
    clearState: true
    permissions:
      all: allow
# Wait for the LoginScreen (debug bundle can take ~30s on first load). testID is locale-proof.
- extendedWaitUntil:
    visible:
      id: "loginBtn"
    timeout: 120000
- tapOn:
    id: "loginBtn"

# ---------------------------------------------------------------------------
# iOS: ASWebAuthenticationSession. First a native consent alert
# ("<App>" Wants to Use "kab.info" to Sign In) → Continue. Then the Keycloak page,
# whose fields are reachable only by visible text.
# ---------------------------------------------------------------------------
- runFlow:
    when:
      platform: iOS
    commands:
      # Native consent alert (only on the first login; harmless no-op otherwise).
      - tapOn:
          text: "Continue"
          optional: true
      # Fill the Keycloak form ONLY if it appears. If the Keycloak SSO cookie already exists
      # (it lives in Safari and survives the app's clearState), the auth session redirects back
      # to the app without showing the form — this whole block is then skipped. `when: visible`
      # waits briefly for the form, so both paths (form / SSO auto-login) work.
      - runFlow:
          when:
            visible:
              text: "Continue with email and password"
          commands:
            - tapOn:
                text: "Continue with email and password"
            - tapOn:
                text: "Email"
            - inputText: ${E2E_USERNAME}
            - tapOn:
                text: "Password"
            - inputText: ${E2E_PASSWORD}
            # Submit via Enter, NOT by tapping the button: inside ASWebAuthenticationSession the
            # Keycloak "Sign In" button is NOT exposed in the accessibility tree (only labels like
            # the title/Email/Password/Register are), so it can't be matched by text or by
            # id=kc-login on iOS. The password field is focused, and the Keycloak form submits on
            # Enter.
            - pressKey: Enter
            # After submit, Safari/iOS may show a native "Save Password?" alert that blocks the
            # OAuth redirect from completing. Dismiss it ("Not Now"); harmless no-op elsewhere.
            - tapOn:
                text: "Not Now"
                optional: true

# ---------------------------------------------------------------------------
# Android: Chrome Custom Tab. HTML ids are exposed as resource-ids (locale-proof).
# The landing page shows social login + "continue with email and password"
# (id: show-traditional-login) — tap it to reveal the username/password form.
# ---------------------------------------------------------------------------
- runFlow:
    when:
      platform: android
    commands:
      - extendedWaitUntil:
          visible:
            id: "show-traditional-login"
          timeout: 45000
      - tapOn:
          id: "show-traditional-login"
      - extendedWaitUntil:
          visible:
            id: "username"
          timeout: 30000
      - tapOn:
          id: "username"
      # On focus, the Google Password Manager "Use saved password?" bottom sheet slides up and
      # covers the field + keyboard, so inputText lands nowhere and username stays EMPTY ->
      # "Invalid username or password". Dismiss it with Back BEFORE typing: nothing is typed yet
      # so Back can't clear input, and the field keeps focus + the keyboard returns.
      - pressKey: Back
      - inputText: ${E2E_USERNAME}
      # Dismiss the keyboard so the password field (hidden behind it) becomes tappable. Use
      # hideKeyboard, NOT KEYCODE_Back: once text is typed, Back would discard a Gboard composing
      # region (non-Latin layout) and re-empty the field.
      - hideKeyboard
      - tapOn:
          id: "password"
      - inputText: ${E2E_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: "kc-login"

# Back in the app after the OAuth redirect. Settings screen "Join Room" (testID).
- extendedWaitUntil:
    visible:
      id: "joinRoomBtn"
    timeout: 90000
- takeScreenshot: verify-results/login-settings
