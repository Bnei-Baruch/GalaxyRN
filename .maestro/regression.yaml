appId: ${APP_ID}
name: regression — full flow (needs E2E creds)
tags:
  - regression
env:
  E2E_USERNAME: ""
  E2E_PASSWORD: ""
---
# Full on-device regression mapped to docs/new-arch-qa-checklist.md.
# All interactive elements matched by testID (see src/**/*Btn.js) — locale-proof.
# Needs -e APP_ID / E2E_USERNAME / E2E_PASSWORD (device-verify.sh loads them from .env).
#
# Self-contained: logs in inline via login.yaml (cross-platform), so it does NOT depend on a
# persisted Keychain session. This matters on the iOS Simulator, where RNSecureStorage cannot
# write the token (adhoc-signed sim build has no application-identifier entitlement, errSec
# -34018) and the session would otherwise be lost on relaunch. On a signed device build the
# Keychain works, so inline login is simply idempotent there.
- runFlow: login.yaml   # ends on the Settings screen with joinRoomBtn visible
- takeScreenshot: verify-results/reg-settings

# --- Join the test room "test mobile" ---
# The modal's search field auto-focuses on open; typing the exact room name auto-selects it
# (RoomSelectModal.handleSearch), which enables the modal's Join button — no list-item tap.
- tapOn:
    id: "roomSelectTrigger"
- inputText: "Test Mobile"
- tapOn:
    id: "joinRoomBtn"
- extendedWaitUntil:
    visible:
      id: "leaveBtn"
    timeout: 60000
- takeScreenshot: verify-results/reg-room
# Visual (subagent): video tiles render via RTCView.

# --- In-room controls ---
- tapOn:
    id: "muteBtn"
- tapOn:
    id: "cammuteBtn"
- tapOn:
    id: "audioModeBtn"
- takeScreenshot: verify-results/reg-controls

# --- Backgrounding: foreground service keeps the call alive ---
- pressKey: Home
- takeScreenshot: verify-results/reg-background
# Visual/logcat (subagent): persistent notification + ForegroundService start.
- launchApp
- assertVisible:
    id: "leaveBtn"
- takeScreenshot: verify-results/reg-foreground

# --- Send logs (More menu) ---
- tapOn:
    id: "moreBtn"
- tapOn:
    id: "sendLogsBtn"
- takeScreenshot: verify-results/reg-sendlogs

# --- Leave the room ---
- tapOn:
    id: "leaveBtn"
- assertVisible:
    id: "joinRoomBtn"
