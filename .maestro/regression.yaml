appId: com.galaxy_mobile
name: regression — full flow (needs E2E creds)
tags:
  - regression
env:
  E2E_USERNAME: ""
  E2E_PASSWORD: ""
---
# Full on-device regression mapped to docs/new-arch-qa-checklist.md.
# All interactive elements matched by testID (see src/**/*Btn.js) — locale-proof.
#
# SKIPS LOGIN for now: log in manually ONCE on the device (the Keycloak session persists in
# RNSecureStorage across relaunch). This flow relaunches WITHOUT clearState so the session is
# restored, then verifies the in-room path. (login.yaml automates login once the Chrome
# saved-password sheet handling is finalized.)
- launchApp:
    permissions:
      all: allow
# Debug bundle takes ~30s to load + restore the session — wait, don't assert immediately.
- extendedWaitUntil:
    visible:
      id: "joinRoomBtn"   # if this times out, log in manually on the device first
    timeout: 120000
- takeScreenshot: verify-results/reg-settings

# --- Join the test room "test mobile" ---
# The modal's search field auto-focuses on open; typing the exact room name auto-selects it
# (RoomSelectModal.handleSearch), which enables the modal's Join button — no list-item tap.
- tapOn:
    id: "roomSelectTrigger"
- inputText: "Test Mobile"
- tapOn:
    id: "joinRoomBtn"
- extendedWaitUntil:
    visible:
      id: "leaveBtn"
    timeout: 60000
- takeScreenshot: verify-results/reg-room
# Visual (subagent): video tiles render via RTCView.

# --- In-room controls ---
- tapOn:
    id: "muteBtn"
- tapOn:
    id: "cammuteBtn"
- tapOn:
    id: "audioModeBtn"
- takeScreenshot: verify-results/reg-controls

# --- Backgrounding: foreground service keeps the call alive ---
- pressKey: Home
- takeScreenshot: verify-results/reg-background
# Visual/logcat (subagent): persistent notification + ForegroundService start.
- launchApp
- assertVisible:
    id: "leaveBtn"
- takeScreenshot: verify-results/reg-foreground

# --- Send logs (More menu) ---
- tapOn:
    id: "moreBtn"
- tapOn:
    id: "sendLogsBtn"
- takeScreenshot: verify-results/reg-sendlogs

# --- Leave the room ---
- tapOn:
    id: "leaveBtn"
- assertVisible:
    id: "joinRoomBtn"
