appId: ${APP_ID}
name: regression — full flow (needs E2E creds)
tags:
  - regression
# No `env:` block — creds come from the exported shell env / `-e` (see login.yaml note).
---
# Full on-device regression mapped to docs/new-arch-qa-checklist.md.
# All interactive elements matched by testID (see src/**/*Btn.js) — locale-proof.
# Needs -e APP_ID / E2E_USERNAME / E2E_PASSWORD (device-verify.sh loads them from .env).
#
# Self-contained: logs in inline via login.yaml (cross-platform), so it does NOT depend on a
# persisted Keychain session. This matters on the iOS Simulator, where RNSecureStorage cannot
# write the token (adhoc-signed sim build has no application-identifier entitlement, errSec
# -34018) and the session would otherwise be lost on relaunch. On a signed device build the
# Keychain works, so inline login is simply idempotent there.
- runFlow: login.yaml   # ends on the Settings screen with joinRoomBtn visible
- takeScreenshot: verify-results/reg-settings
# joinRoomBtn shows while initApp() (MQTT, fetchRooms) is still running; BeforeRoom re-renders
# when it finishes (~4s) and a room-select modal opened before that gets swallowed. Settle first
# (Maestro has no sleep: wait for an element that never exists, optional).
- extendedWaitUntil:
    visible:
      id: "__settle_never_present__"
    timeout: 8000
    optional: true

# --- Join the test room "test mobile" ---
# The modal's search field auto-focuses on open; typing the exact room name auto-selects it
# (RoomSelectModal.handleSearch), which enables the modal's Join button — no list-item tap.
# Shared subflow: waits for the modal's open animation + search field (the inline taps raced it).
- runFlow: select-room.yaml   # ends in the room (leaveBtn visible)
# The search field's keyboard can stay up after joining; dismiss it so it doesn't cover the bar.
# Only when the bar is actually hidden: on Android `hideKeyboard` with no keyboard up sends BACK,
# which (no JS BackHandler) moves the in-room task to the background and every next step fails.
- runFlow:
    when:
      notVisible:
        id: "muteBtn"
    commands:
      - hideKeyboard
- takeScreenshot: verify-results/reg-room
# Visual (subagent): video tiles render via RTCView.

# --- In-room controls ---
- tapOn:
    id: "muteBtn"
- tapOn:
    id: "cammuteBtn"
- tapOn:
    id: "audioModeBtn"
- takeScreenshot: verify-results/reg-controls

# --- Backgrounding: foreground service keeps the call alive ---
- pressKey: Home
- takeScreenshot: verify-results/reg-background
# Visual/logcat (subagent): persistent notification + ForegroundService start.
# stopApp: false — plain `launchApp` force-stops the process first (Maestro default), which
# kills the backgrounded/PiP call instead of bringing it back to the foreground.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "leaveBtn"
    timeout: 15000
- takeScreenshot: verify-results/reg-foreground


# --- Leave the room ---
- tapOn:
    id: "leaveBtn"
- extendedWaitUntil:
    visible:
      id: "joinRoomBtn"
    timeout: 30000

# --- Send logs (account menu = the "Screen name" dropdown on the before-room screen) ---
# There is no sendLogsBtn testID (the old step targeted the in-room More menu, where Send Logs
# no longer lives). The dropdown has no testID either: tap it by position (top field), then
# pick the item by its English text. Assumes English UI.
- tapOn:
    point: "50%,13%"
- tapOn:
    text: "Send Logs"
- extendedWaitUntil:
    visible:
      text: "Logs sent|Failed to send logs"
    timeout: 30000
- takeScreenshot: verify-results/reg-sendlogs
- tapOn:
    text: "OK"
    optional: true
- assertVisible:
    id: "joinRoomBtn"
