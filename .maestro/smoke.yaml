appId: com.galaxy_mobile
name: smoke — app launches to LoginScreen
tags:
  - smoke
---
# Credential-less smoke test: proves the JS bundle loads, native init
# (WebRTC / audio / TurboModules) does not crash, and the Android permission
# gate auto-clears. Runs with ZERO Claude tokens.
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      all: allow
# The JS gate (src/services/AndroidPermissions.js) polls every ~1s and clears
# itself once permissions are granted, so no tap is needed here.
# Maestro matches `text:` as a regex — cover the app brand across locales
# (Arvut / Арвут / ...), which is the most stable assertion for the LoginScreen.
- extendedWaitUntil:
    visible:
      text: "Arvut|Арвут|ארווט"
    timeout: 90000
- assertVisible:
    text: "Arvut|Арвут|ארווט"
# Login button, also locale-tolerant (LOGIN / ВОЙТИ / כניסה / ...).
- assertVisible:
    text: "LOGIN|ВОЙТИ|Login|Войти|כניסה"
- takeScreenshot: verify-results/smoke-login
